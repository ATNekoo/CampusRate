$kind: http-request
url: "{{baseUrl}}/places"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('X-Content-Type-Options is nosniff', function () {
          pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.equal('nosniff');
      });
      pm.test('Content-Security-Policy is present', function () {
          pm.response.to.have.header('Content-Security-Policy');
      });
      pm.test('X-Powered-By is absent', function () {
          pm.response.to.not.have.header('X-Powered-By');
      });
    language: text/javascript
order: 26000
