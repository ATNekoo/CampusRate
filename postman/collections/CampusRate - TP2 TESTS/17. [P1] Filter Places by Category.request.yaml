$kind: http-request
url: "{{baseUrl}}/places?category=LIBRARY&page=1&limit=10"
method: GET
queryParams:
  category: LIBRARY
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('Response has data and pagination', function () {
          pm.expect(body).to.have.property('data');
          pm.expect(body).to.have.property('pagination');
      });
      pm.test('All results match the requested category', function () {
          body.data.forEach((place) => {
              pm.expect(place.category).to.equal('LIBRARY');
          });
      });
    language: text/javascript
order: 17000
