$kind: http-request
url: "{{baseUrl}}/places"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Dup test",
      "description": "Duplicate test place.",
      "category": "LIBRARY",
      "address": "Dup address"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
      });
      pm.test('Content-Type is application/problem+json', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      });
    language: text/javascript
order: 24000
