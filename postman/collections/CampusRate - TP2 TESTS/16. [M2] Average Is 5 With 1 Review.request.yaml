$kind: http-request
url: "{{baseUrl}}/places/{{placeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('averageRating is 5 and reviewCount is 1', function () {
          pm.expect(body.averageRating).to.equal(5);
          pm.expect(body.reviewCount).to.equal(1);
      });
    language: text/javascript
order: 16000
